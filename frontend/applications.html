<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Корочки.есть — онлайн-курсы дополнительного профессионального образования: каталог, запись на обучение, личный кабинет.">
  <title>Мои заявки — Корочки.есть</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/js/common.js" defer></script>
  <script src="/js/applications.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Перейти к содержимому</a>
  <header class="site">
    <div class="container">
      <a class="brand" href="/">Корочки.есть</a>
      <nav aria-label="Главное меню"><ul id="nav"></ul></nav>
    </div>
  </header>
  <main id="main" class="container">
    <h1>Мои заявки</h1>
    <p><a class="btn" href="/create_application">Записаться на курс</a></p>
    <p id="message" role="alert" class="alert error" hidden></p>
    <p id="status" class="status-line" role="status" aria-live="polite"></p>
    <div class="table-wrap">
      <table aria-label="Мои заявки">
        <thead><tr><th scope="col">№</th><th scope="col">Курс</th><th scope="col">Дата начала</th><th scope="col">Статус</th><th scope="col">Действие</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="pager">
      <button type="button" id="prev" class="btn-secondary" disabled>Назад</button>
      <span id="page-label">Страница 1</span>
      <button type="button" id="next" class="btn-secondary" disabled>Вперёд</button>
    </div>
  </main>
  <footer class="site"><div class="container">© 2026 Корочки.есть — учебный проект ПМ.09</div></footer>
</body>
</html>
