<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Корочки.есть — онлайн-курсы дополнительного профессионального образования: каталог, запись на обучение, личный кабинет.">
  <title>Каталог курсов — Корочки.есть</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/js/common.js" defer></script>
  <script src="/js/catalog.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Перейти к содержимому</a>
  <header class="site">
    <div class="container">
      <a class="brand" href="/">Корочки.есть</a>
      <nav aria-label="Главное меню"><ul id="nav"></ul></nav>
    </div>
  </header>
  <main id="main" class="container">
    <h1>Каталог курсов ДПО</h1>
    <p class="lead">Выберите направление и запишитесь на программу дополнительного профессионального образования.</p>
    <div class="toolbar">
      <div class="field">
        <label for="category">Направление</label>
        <select id="category"><option value="">Все направления</option></select>
      </div>
    </div>
    <p id="status" class="status-line" role="status" aria-live="polite"></p>
    <div id="cards" class="cards" aria-busy="false"></div>
    <div id="sentinel" aria-hidden="true"></div>
    <noscript><p class="alert error">Для работы каталога нужен JavaScript.</p></noscript>
  </main>
  <footer class="site"><div class="container">© 2026 Корочки.есть — учебный проект ПМ.09</div></footer>
</body>
</html>
